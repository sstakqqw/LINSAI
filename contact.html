<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | LINSAI</title>
    <style>
        /* 全局样式 */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; line-height:1.7; color:#1a1a1a; }
        .container { max-width:1200px; margin:0 auto; padding:0 24px; }
        header { border-bottom:1px solid #e5e5e5; padding:20px 0; }
        .header-inner { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; }
        .logo { font-size:1.8rem; font-weight:700; color:#2c3e50; text-decoration:none; }
        .nav-menu { display:flex; list-style:none; gap:32px; flex-wrap:wrap; }
        .nav-menu a { text-decoration:none; color:#2c3e50; font-weight:500; }
        .nav-menu a:hover { color:#c0392b; }
        .lang-switch { display:flex; gap:8px; }
        .lang-switch a { text-decoration:none; color:#888; }
        .lang-switch a.active { color:#1a1a1a; font-weight:500; }
        footer { border-top:1px solid #eee; padding:30px 0; margin-top:60px; text-align:center; color:#888; }
        /* 页面特有样式 */
        .page-title { background:#f9f9f9; padding:60px 0 20px; text-align:center; margin-bottom:50px; }
        .page-title h1 { font-size:2.4rem; font-weight:500; }
        .contact-info { background:#f5f5f5; padding:40px; border-radius:12px; margin:40px 0; }
        .info-row { display:flex; margin-bottom:20px; align-items:center; }
        .info-label { width:120px; font-weight:600; }
        .info-value { flex:1; }
        .form-group { margin-bottom:25px; }
        .form-group label { display:block; margin-bottom:8px; font-weight:500; }
        .form-group input, .form-group textarea { width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; font-size:1rem; }
        .form-group textarea { min-height:150px; }
        .btn { background:#c0392b; color:#fff; border:none; padding:14px 40px; border-radius:40px; font-size:1rem; cursor:pointer; transition:background 0.2s; }
        .btn:hover { background:#a93226; }
        @media (max-width:768px) { .nav-menu { display:none; } }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">LINSAI</a>
            <ul class="nav-menu">
                <li><a href="index.html">TOP</a></li>
                <li><a href="service.html">事業内容</a></li>
                <li><a href="company.html">企業情報</a></li>
                <li><a href="message.html">創業者メッセージ</a></li>
                <li><a href="products.html">产品</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
            </ul>
            <div class="lang-switch">
                <a href="#" class="active">JP</a>
                <span>/</span>
                <a href="#">EN</a>
            </div>
        </div>
    </header>

    <div class="page-title">
        <div class="container">
            <h1>お問い合わせ</h1>
        </div>
    </div>

    <main class="container">
        <div class="contact-info">
            <div class="info-row">
                <span class="info-label">所在地</span>
                <span class="info-value">〒114-0023 東京都北区滝野川3-39-7</span>
            </div>
            <div class="info-row">
                <span class="info-label">TEL</span>
                <span class="info-value">03-5972-4939</span>
            </div>
            <div class="info-row">
                <span class="info-label">FAX</span>
                <span class="info-value">03-5972-4940</span>
            </div>
            <div class="info-row">
                <span class="info-label">営業時間</span>
                <span class="info-value">平日 9:00～18:00</span>
            </div>
        </div>

        <h2 style="font-size:1.8rem; margin:60px 0 30px;">メールでのお問い合わせ</h2>
        <form action="#" method="post" style="max-width:700px;">
            <div class="form-group">
                <label for="name">お名前 <span style="color:#c0392b;">*</span></label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">メールアドレス <span style="color:#c0392b;">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="company">会社名</label>
                <input type="text" id="company" name="company">
            </div>
            <div class="form-group">
                <label for="message">お問い合わせ内容 <span style="color:#c0392b;">*</span></label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn">送信する</button>
        </form>
        <p style="margin-top:20px; color:#888;">※実際にフォームを動作させるには、送信先の設定が必要です。</p>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 LINSAI Inc. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
