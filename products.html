<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品 | LINSAI</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            line-height:1.7;
            color:#1a1a1a;
            background:#fff;
        }
        .container { max-width:1200px; margin:0 auto; padding:0 24px; }
        header {
            border-bottom:1px solid #e5e5e5;
            padding:20px 0;
        }
        .header-inner {
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
        }
        .logo {
            font-size:1.8rem;
            font-weight:700;
            color:#2c3e50;
            text-decoration:none;
        }
        .nav-menu {
            display:flex;
            list-style:none;
            gap:32px;
            flex-wrap:wrap;
        }
        .nav-menu a {
            text-decoration:none;
            color:#2c3e50;
            font-weight:500;
        }
        .nav-menu a:hover { color:#c0392b; }
        .lang-switch {
            display:flex;
            gap:8px;
        }
        .lang-switch a {
            text-decoration:none;
            color:#888;
        }
        .lang-switch a.active {
            color:#1a1a1a;
            font-weight:500;
        }
        footer {
            border-top:1px solid #eee;
            padding:30px 0;
            margin-top:60px;
            text-align:center;
            color:#888;
        }
        .page-title {
            background:#f9f9f9;
            padding:60px 0 20px;
            text-align:center;
            margin-bottom:50px;
        }
        .page-title h1 {
            font-size:2.4rem;
            font-weight:500;
        }
        .product-grid {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:30px;
            margin:50px 0;
        }
        .product-card {
            display:flex;
            flex-direction:column;
            border:1px solid #eee;
            border-radius:12px;
            overflow:hidden;
            transition:box-shadow 0.2s;
            text-decoration:none;
            color:inherit;
            background-color:#fff;
        }
        .product-card:hover {
            box-shadow:0 10px 20px rgba(0,0,0,0.05);
        }
        .product-img {
            width:100%;
            height:200px;
            object-fit:cover;
            display:block;
        }
        .product-info {
            padding:20px;
            flex:1;
        }
        .product-info h3 {
            font-size:1.4rem;
            margin-bottom:10px;
        }
        .product-info p {
            color:#666;
            margin-bottom:15px;
        }
        .product-price {
            font-weight:600;
            color:#c0392b;
        }
        @media (max-width:768px) {
            .nav-menu { display:none; }
            .product-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">LINSAI</a>
            <ul class="nav-menu">
                <li><a href="index.html">TOP</a></li>
                <li><a href="service.html">事業内容</a></li>
                <li><a href="company.html">企業情報</a></li>
                <li><a href="message.html">創業者メッセージ</a></li>
                <li><a href="products.html">产品</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
            </ul>
            <div class="lang-switch">
                <a href="#" class="active">JP</a>
                <span>/</span>
                <a href="#">EN</a>
            </div>
        </div>
    </header>

    <div class="page-title">
        <div class="container">
            <h1>产品</h1>
        </div>
    </div>

    <main class="container">
        <!-- 产品列表容器（动态渲染） -->
        <div class="product-grid" id="productGrid"></div>

    <footer>
        <div class="container">
            <p>© 2026 LINSAI Inc. All Rights Reserved.</p>
        </div>

</body>
</html>
